name: WA Auto Absensi CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node Project
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run project tests
        run: npm test

      - name: Verify WhatsApp dependencies load
        run: |
          node -e "require('whatsapp-web.js'); require('qrcode-terminal'); console.log('DEPENDENCY_REQUIRE=PASS')"

      - name: Syntax check WhatsApp source
        run: |
          node --check src/attendance.js
          node --check src/duplicate-guard.js
          node --check src/wa-capture-testing.js
          node --check src/wa-read-project.js
          node --check src/wa-read-doc-image.js
          node --check src/wa-send-checkin-testing.js
          node --check src/wa-send-checkout-testing.js
          node --check src/wa-send-checkin-production.js
          node --check src/wa-send-checkout-production.js
          node --check src/remote-auth-v3.js
          node --check src/wa-remote-auth-v3-bootstrap.js
          node --check src/wa-remote-auth-v3-health.js
          node --check src/wa-remote-auth-v3-seed-last-good.js
          node --check src/wa-self-chat-ingest-production-v3.js
          echo "SOURCE_SYNTAX=PASS"

      - name: Verify RemoteAuth V3 no-send guards
        shell: bash
        run: |
          set -Eeuo pipefail

          for source in \
            src/remote-auth-v3.js \
            src/wa-remote-auth-v3-bootstrap.js \
            src/wa-remote-auth-v3-health.js \
            src/wa-remote-auth-v3-seed-last-good.js
          do
            if grep -Fq 'sendMessage(' "$source"; then
              echo "REMOTE_V3_SEND_CALL_FOUND=$source"
              exit 30
            fi
          done

          grep -Fq \
            'REMOTE_AUTH_V3_CANDIDATE_SESSION' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_AUTH_V3_LAST_GOOD_SESSION' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_V3_CANDIDATE_ROUNDTRIP=PASS' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_V3_FALLBACK_USED=YES' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_V3_BOOTSTRAP=PASS' \
            src/wa-remote-auth-v3-bootstrap.js

          grep -Fq \
            'REMOTE_V3_HEALTH=PASS' \
            src/wa-remote-auth-v3-health.js

          grep -Fq \
            'REMOTE_V3_LAST_GOOD_SEED_WORKFLOW=PASS' \
            src/wa-remote-auth-v3-seed-last-good.js

          echo "REMOTE_V3_SEND_CALL_FOUND=NO"
          echo "REMOTE_V3_STATIC_GUARD=PASS"

      - name: Verify Production RemoteAuth V3 cutover guards
        shell: bash
        run: |
          set -Eeuo pipefail

          for source in \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js \
            src/wa-self-chat-ingest-production-v3.js
          do
            grep -Fq \
              "require('./remote-auth-v3')" \
              "$source"

            grep -Fq \
              'REMOTE_AUTH_VERSION=V3' \
              "$source"
          done

          if grep -Fq \
            "require('./remote-auth')" \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js \
            src/wa-self-chat-ingest-production-v3.js
          then
            echo "PRODUCTION_V2_IMPORT_REMAINS=YES"
            exit 31
          fi

          if grep -Fq \
            'sendMessage(' \
            src/wa-self-chat-ingest-production-v3.js
          then
            echo "PRODUCTION_V3_SYNC_SEND_CALL=YES"
            exit 32
          fi

          echo "PRODUCTION_V2_IMPORT_REMAINS=NO"
          echo "PRODUCTION_V3_SYNC_SEND_CALL=NO"
          echo "PRODUCTION_REMOTEAUTH_V3_STATIC_GUARD=PASS"

      - name: Safe result
        run: |
          echo "============================================================"
          echo "WA AUTO ABSENSI CI"
          echo "NPM_CI=PASS"
          echo "TESTS=PASS"
          echo "DEPENDENCY_REQUIRE=PASS"
          echo "SOURCE_SYNTAX=PASS"
          echo "WHATSAPP_LOGIN=NO"
          echo "MESSAGE_SENT=NO"
          echo "STEP_4_1=PASS"
          echo "============================================================"
