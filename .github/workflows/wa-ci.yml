name: WA Auto Absensi CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node Project
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run project tests
        run: npm test

      - name: Verify WhatsApp dependencies load
        run: |
          node -e "require('whatsapp-web.js'); require('qrcode-terminal'); console.log('DEPENDENCY_REQUIRE=PASS')"

      - name: Syntax check WhatsApp source
        run: |
          node --check src/attendance.js
          node --check src/duplicate-guard.js
          node --check src/wa-capture-testing.js
          node --check src/wa-read-project.js
          node --check src/wa-read-doc-image.js
          node --check src/wa-send-checkin-testing.js
          node --check src/wa-send-checkout-testing.js
          node --check src/wa-send-checkin-production.js
          node --check src/wa-send-checkout-production.js
          node --check src/remote-auth-v3.js
          node --check src/wa-remote-auth-v3-bootstrap.js
          node --check src/wa-remote-auth-v3-health.js
          node --check src/wa-remote-auth-v3-seed-last-good.js
          node --check src/wa-self-chat-ingest-production-v3.js
          node --check src/wa-send-checkout-v3-proof-testing.js
          node --check src/wa-send-checkin-v3-proof-testing.js
          node --check src/wa-input-parser-v3-proof.js
          node --check src/wa-live-self-chat-input-proof-v3.js
          node --check src/wa-attendance-canonical-guard.js
          echo "SOURCE_SYNTAX=PASS"

      - name: Verify RemoteAuth V3 no-send guards
        shell: bash
        run: |
          set -Eeuo pipefail

          for source in \
            src/remote-auth-v3.js \
            src/wa-remote-auth-v3-bootstrap.js \
            src/wa-remote-auth-v3-health.js \
            src/wa-remote-auth-v3-seed-last-good.js
          do
            if grep -Fq 'sendMessage(' "$source"; then
              echo "REMOTE_V3_SEND_CALL_FOUND=$source"
              exit 30
            fi
          done

          grep -Fq \
            'REMOTE_AUTH_V3_CANDIDATE_SESSION' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_AUTH_V3_LAST_GOOD_SESSION' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_V3_CANDIDATE_ROUNDTRIP=PASS' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_V3_FALLBACK_USED=YES' \
            src/remote-auth-v3.js

          grep -Fq \
            'REMOTE_V3_BOOTSTRAP=PASS' \
            src/wa-remote-auth-v3-bootstrap.js

          grep -Fq \
            'REMOTE_V3_HEALTH=PASS' \
            src/wa-remote-auth-v3-health.js

          grep -Fq \
            'REMOTE_V3_LAST_GOOD_SEED_WORKFLOW=PASS' \
            src/wa-remote-auth-v3-seed-last-good.js

          echo "REMOTE_V3_SEND_CALL_FOUND=NO"
          echo "REMOTE_V3_STATIC_GUARD=PASS"

      - name: Verify Production RemoteAuth V3 cutover guards
        shell: bash
        run: |
          set -Eeuo pipefail

          for source in \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js \
            src/wa-self-chat-ingest-production-v3.js
          do
            grep -Fq \
              "require('./remote-auth-v3')" \
              "$source"

            grep -Fq \
              'REMOTE_AUTH_VERSION=V3' \
              "$source"
          done

          if grep -Fq \
            "require('./remote-auth')" \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js \
            src/wa-self-chat-ingest-production-v3.js
          then
            echo "PRODUCTION_V2_IMPORT_REMAINS=YES"
            exit 31
          fi

          if grep -Fq \
            'sendMessage(' \
            src/wa-self-chat-ingest-production-v3.js
          then
            echo "PRODUCTION_V3_SYNC_SEND_CALL=YES"
            exit 32
          fi

          echo "PRODUCTION_V2_IMPORT_REMAINS=NO"
          echo "PRODUCTION_V3_SYNC_SEND_CALL=NO"
          echo "PRODUCTION_REMOTEAUTH_V3_STATIC_GUARD=PASS"

      - name: Verify V3 E2E proof Testing guards
        shell: bash
        run: |
          set -Eeuo pipefail

          PROOF=src/wa-send-checkout-v3-proof-testing.js

          grep -Fq \
            'WA_PRODUCTION_V3_E2E_PROOF_TESTING_V1' \
            "$PROOF"

          grep -Fq \
            "EXPECTED_GROUP_NAME = 'Testing'" \
            "$PROOF"

          grep -Fq \
            "require('./remote-auth-v3')" \
            "$PROOF"

          grep -Fq \
            'REMOTE_AUTH_VERSION=V3' \
            "$PROOF"

          grep -Fq \
            'E2E_PROOF_ONE_REAL_SEND_MAX=YES' \
            "$PROOF"

          grep -Fq \
            'E2E_PROOF_AUTOMATIC_RETRY=NO' \
            "$PROOF"

          grep -Fq \
            'UI_SEND_COMMIT_CONFIRMED=YES' \
            "$PROOF"

          grep -Fq \
            'SERVER_ACK_CONFIRMED=YES' \
            "$PROOF"

          grep -Fq \
            'E2E_PROOF=PASS' \
            "$PROOF"

          if grep -Fq \
            'Aktif Tim Magang OCN' \
            "$PROOF"
          then
            echo "E2E_PROOF_MAIN_GROUP_REFERENCE=YES"
            exit 40
          fi

          echo "E2E_PROOF_MAIN_GROUP_REFERENCE=NO"
          echo "E2E_PROOF_STATIC_GUARD=PASS"

      - name: Verify full V3 proof guards
        shell: bash
        run: |
          set -Eeuo pipefail

          CHECKIN=src/wa-send-checkin-v3-proof-testing.js
          CHECKOUT=src/wa-send-checkout-v3-proof-testing.js
          PARSER=src/wa-input-parser-v3-proof.js

          grep -Fq 'WA_PRODUCTION_V3_CHECKIN_PROOF_TESTING_V1' "$CHECKIN"
          grep -Fq "EXPECTED_GROUP_NAME = 'Testing'" "$CHECKIN"
          grep -Fq "require('./remote-auth-v3')" "$CHECKIN"
          grep -Fq 'REMOTE_AUTH_VERSION=V3' "$CHECKIN"
          grep -Fq 'client.sendMessage(' "$CHECKIN"
          grep -Fq 'SERVER_ACK_CONFIRMED=YES' "$CHECKIN"
          grep -Fq 'E2E_PROOF_CHECKIN=PASS' "$CHECKIN"

          grep -Fq 'WA_PRODUCTION_V3_E2E_PROOF_TESTING_V1' "$CHECKOUT"
          grep -Fq "EXPECTED_GROUP_NAME = 'Testing'" "$CHECKOUT"
          grep -Fq "require('./remote-auth-v3')" "$CHECKOUT"
          grep -Fq 'REMOTE_AUTH_VERSION=V3' "$CHECKOUT"
          grep -Fq 'SERVER_ACK_CONFIRMED=YES' "$CHECKOUT"
          grep -Fq 'E2E_PROOF=PASS' "$CHECKOUT"

          grep -Fq 'P_COLON_RUNTIME_PARSE=PASS' "$PARSER"
          grep -Fq 'P_IMAGE_RUNTIME_PARSE=PASS' "$PARSER"
          grep -Fq 'PRODUCTION_ATTENDANCE_DATA_MODIFIED=NO' "$PARSER"

          if grep -Fq 'Aktif Tim Magang OCN' "$CHECKIN" "$CHECKOUT"; then
            echo "FULL_PROOF_MAIN_GROUP_REFERENCE=YES"
            exit 50
          fi

          echo "FULL_PROOF_MAIN_GROUP_REFERENCE=NO"
          echo "FULL_PROOF_STATIC_GUARD=PASS"

      - name: Run P and P-colon parser proof
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run wa:input-parser-v3-proof | tee input-parser-proof.log

          grep -Fxq 'P_COLON_RUNTIME_PARSE=PASS' input-parser-proof.log
          grep -Fxq 'P_IMAGE_RUNTIME_PARSE=PASS' input-parser-proof.log
          grep -Fxq 'P_AND_P_COLON_PROOF=PASS' input-parser-proof.log
          grep -Fxq 'PRODUCTION_ATTENDANCE_DATA_MODIFIED=NO' input-parser-proof.log
          grep -Fxq 'WHATSAPP_MESSAGE_SENT=NO' input-parser-proof.log

          echo "INPUT_PARSER_PROOF_CI=PASS"

      - name: Verify live self-chat proof guards
        shell: bash
        run: |
          set -Eeuo pipefail

          LIVE=src/wa-live-self-chat-input-proof-v3.js
          GUARD=src/wa-attendance-canonical-guard.js

          grep -Fq 'REAL SELF-CHAT: p: PROJECT + IMAGE CAPTION p' "$LIVE"
          grep -Fq 'LIVE_PROOF_P_COLON_PARSE=PASS' "$LIVE"
          grep -Fq 'LIVE_PROOF_P_IMAGE_PARSE=PASS' "$LIVE"
          grep -Fq 'LIVE_PROOF_SELF_CHAT_CLEANUP=PASS' "$LIVE"
          grep -Fq 'LIVE_PROOF_FAILSAFE_REVOKE_VISIBILITY' "$LIVE"
          grep -Fq 'LIVE_PROOF_TOTAL_SELF_CHAT_SENDS=2' "$LIVE"
          grep -Fq 'LIVE_PROOF_GROUP_MESSAGE_SENT=NO' "$LIVE"

          SEND_CALLS="$(grep -Fc 'client.sendMessage(' "$LIVE" || true)"
          if [ "$SEND_CALLS" != "2" ]; then
            echo "LIVE_PROOF_SEND_CALL_COUNT=$SEND_CALLS"
            exit 70
          fi

          if grep -Fq 'Aktif Tim Magang OCN' "$LIVE"; then
            echo "LIVE_PROOF_MAIN_GROUP_REFERENCE=YES"
            exit 71
          fi

          if grep -Fq "EXPECTED_GROUP_NAME" "$LIVE"; then
            echo "LIVE_PROOF_GROUP_TARGET_LOGIC=YES"
            exit 72
          fi

          if grep -Fq "attendance-input-store" "$LIVE"; then
            echo "LIVE_PROOF_ATTENDANCE_STORE_IMPORT=YES"
            exit 73
          fi

          grep -Fq 'CANONICAL_SNAPSHOT=PASS' "$GUARD"
          grep -Fq 'CANONICAL_COMPARE=PASS' "$GUARD"
          grep -Fq 'CANONICAL_STATE_CHANGED' "$GUARD"

          if grep -Eq '\.(insertOne|updateOne|deleteOne|deleteMany|replaceOne)\(' "$GUARD"; then
            echo "CANONICAL_GUARD_WRITE_CALL=YES"
            exit 74
          fi

          echo "LIVE_PROOF_SEND_CALL_COUNT=2"
          echo "LIVE_PROOF_MAIN_GROUP_REFERENCE=NO"
          echo "LIVE_PROOF_GROUP_TARGET_LOGIC=NO"
          echo "LIVE_PROOF_ATTENDANCE_STORE_IMPORT=NO"
          echo "CANONICAL_GUARD_WRITE_CALL=NO"
          echo "LIVE_SELF_CHAT_PROOF_STATIC_GUARD=PASS"

      - name: Safe result
        run: |
          echo "============================================================"
          echo "WA AUTO ABSENSI CI"
          echo "NPM_CI=PASS"
          echo "TESTS=PASS"
          echo "DEPENDENCY_REQUIRE=PASS"
          echo "SOURCE_SYNTAX=PASS"
          echo "WHATSAPP_LOGIN=NO"
          echo "MESSAGE_SENT=NO"
          echo "STEP_4_1=PASS"
          echo "============================================================"
