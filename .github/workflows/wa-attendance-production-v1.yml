name: WA Attendance Production V1

on:
  workflow_dispatch:
    inputs:
      action:
        description: Attendance action
        required: true
        type: choice
        options:
          - checkin
          - checkout
      confirm:
        description: Type Production to authorize the main-group run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wa-attendance-production-cloud
  cancel-in-progress: false

jobs:
  attendance-production:
    name: Attendance Production Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Locate Chrome
        shell: bash
        run: |
          set -Eeuo pipefail

          CHROME=""

          for candidate in \
            google-chrome-stable \
            google-chrome \
            chromium \
            chromium-browser
          do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            echo "CHROME_FOUND=NO"
            exit 20
          fi

          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "CHROME_FOUND=YES"

      - name: Resolve attendance trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "0 6 * * 1-6")
                ACTION="checkin"
                ;;
              "0 17 * * 1-6")
                ACTION="checkout"
                ;;
              *)
                echo "UNKNOWN_SCHEDULE=YES"
                exit 19
                ;;
            esac

            CONFIRM="Production"

          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ACTION="$INPUT_ACTION"
            CONFIRM="$INPUT_CONFIRM"

          else
            echo "UNSUPPORTED_EVENT=$EVENT_NAME"
            exit 20
          fi

          echo "ATTENDANCE_ACTION=$ACTION" >> "$GITHUB_ENV"
          echo "ATTENDANCE_CONFIRM=$CONFIRM" >> "$GITHUB_ENV"

          echo "ATTENDANCE_TRIGGER_RESOLVED=YES"
          echo "ATTENDANCE_EVENT=$EVENT_NAME"
          echo "ATTENDANCE_ACTION=$ACTION"

      - name: Attendance Production safety guard
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "$ATTENDANCE_CONFIRM" != "Production" ]; then
            echo "PRODUCTION_CONFIRMATION=FAIL"
            exit 21
          fi

          echo "PRODUCTION_CONFIRMATION=PASS"

          case "$ATTENDANCE_ACTION" in
            checkin|checkout)
              ;;
            *)
              echo "ATTENDANCE_ACTION_VALID=NO"
              exit 22
              ;;
          esac

          echo "ATTENDANCE_ACTION_VALID=YES"

          for source in \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js
          do
            grep -Fq \
              'WA_AUTO_ABSENSI_DUAL_AUTH_V1' \
              "$source"

            grep -Fq \
              "EXPECTED_GROUP_NAME = 'Aktif Tim Magang OCN'" \
              "$source"

            grep -Fq \
              "require('./remote-auth-v3')" \
              "$source"

            grep -Fq \
              "createRemoteAuthV3" \
              "$source"

            grep -Fq \
              "REMOTE_AUTH_VERSION=V3" \
              "$source"

            grep -Fq \
              "REMOTE_SESSION_MISSING" \
              "$source"

            grep -Fq \
              "REMOTE_AUTH_QR_FORBIDDEN=YES" \
              "$source"
          done

          if grep -Eq \
            '[0-9]{10,}@g\.us' \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js
          then
            echo "HARDCODED_GROUP_ID=YES"
            exit 23
          fi

          if grep -Fq \
            "EXPECTED_GROUP_NAME = 'Testing'" \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js
          then
            echo "TESTING_GROUP_REFERENCE=YES"
            exit 24
          fi

          if grep -Fq \
            "require('./remote-auth')" \
            src/wa-send-checkin-production.js \
            src/wa-send-checkout-production.js
          then
            echo "PRODUCTION_V2_IMPORT_REMAINS=YES"
            exit 25
          fi

          echo "HARDCODED_GROUP_ID=NO"
          echo "TESTING_GROUP_REFERENCE=NO"
          echo "PRODUCTION_V2_IMPORT_REMAINS=NO"
          echo "PRODUCTION_REMOTEAUTH_VERSION=V3"
          echo "PRODUCTION_SOURCE_GUARD=PASS"

      # WA_AUTO_ABSENSI_ATLAS_DYNAMIC_IP_ADD_V1
      - name: Add temporary Atlas runner IP
        shell: bash
        env:
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: |
          set -Eeuo pipefail

          : "${ATLAS_CLIENT_ID:?ATLAS_CLIENT_ID missing}"
          : "${ATLAS_CLIENT_SECRET:?ATLAS_CLIENT_SECRET missing}"
          : "${ATLAS_PROJECT_ID:?ATLAS_PROJECT_ID missing}"

          API_ACCEPT="application/vnd.atlas.2025-03-12+json"

          TOKEN_JSON="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://cloud.mongodb.com/api/oauth/token" \
              --user "${ATLAS_CLIENT_ID}:${ATLAS_CLIENT_SECRET}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data "grant_type=client_credentials"
          )"

          ACCESS_TOKEN="$(
            printf '%s' "$TOKEN_JSON" |
              jq -r '.access_token // empty'
          )"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ATLAS_OAUTH=FAIL"
            exit 30
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ATLAS_OAUTH=PASS"

          RUNNER_IP="$(
            curl \
              -4 \
              --fail \
              --silent \
              --show-error \
              "https://api.ipify.org"
          )"

          python3 - "$RUNNER_IP" <<'PY'
          import ipaddress
          import sys

          ip = ipaddress.ip_address(sys.argv[1].strip())

          if ip.version != 4:
              raise SystemExit("Runner public address is not IPv4")
          PY

          echo "::add-mask::$RUNNER_IP"

          echo "ATLAS_RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "ATLAS_IP_CREATED=0" >> "$GITHUB_ENV"

          BASE_URL="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"

          CHECK_CODE="$(
            curl \
              --silent \
              --show-error \
              --output atlas-existing.json \
              --write-out "%{http_code}" \
              --request GET \
              --url "${BASE_URL}/${RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$CHECK_CODE" = "200" ]; then

            echo "ATLAS_IP_PREEXISTING=YES"

          elif [ "$CHECK_CODE" = "404" ]; then

            echo "ATLAS_IP_PREEXISTING=NO"

            DELETE_AFTER="$(
              date -u \
                -d '+30 minutes' \
                '+%Y-%m-%dT%H:%M:%SZ'
            )"

            COMMENT="WA Auto Absensi RemoteAuth ${GITHUB_RUN_ID}"

            PAYLOAD="$(
              jq -nc \
                --arg ip "$RUNNER_IP" \
                --arg comment "$COMMENT" \
                --arg deleteAfterDate "$DELETE_AFTER" \
                '[{
                  ipAddress: $ip,
                  comment: $comment,
                  deleteAfterDate: $deleteAfterDate
                }]'
            )"

            ADD_CODE="$(
              curl \
                --silent \
                --show-error \
                --output atlas-add.json \
                --write-out "%{http_code}" \
                --request POST \
                --url "$BASE_URL" \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                --header "Accept: ${API_ACCEPT}" \
                --header "Content-Type: application/json" \
                --data "$PAYLOAD"
            )"

            if [ "$ADD_CODE" != "200" ] &&
               [ "$ADD_CODE" != "201" ]; then

              echo "ATLAS_IP_ADD=FAIL"
              exit 31
            fi

            echo "ATLAS_IP_CREATED=1" >> "$GITHUB_ENV"

            echo "ATLAS_IP_ADD=PASS"
            echo "ATLAS_IP_TEMPORARY_EXPIRY=ENABLED"

          else

            echo "ATLAS_IP_PRECHECK_HTTP=${CHECK_CODE}"
            echo "ATLAS_IP_PRECHECK=FAIL"
            exit 32
          fi

          ACTIVE=0

          for ATTEMPT in $(seq 1 24); do

            STATUS_JSON="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request GET \
                --url "${BASE_URL}/${RUNNER_IP}/status" \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                --header "Accept: ${API_ACCEPT}"
            )"

            STATUS="$(
              printf '%s' "$STATUS_JSON" |
                jq -r '.STATUS // .status // empty'
            )"

            echo "ATLAS_IP_STATUS=${STATUS:-UNKNOWN}"

            if [ "$STATUS" = "ACTIVE" ]; then
              ACTIVE=1
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "ATLAS_IP_ACTIVATION=FAIL"
              exit 33
            fi

            sleep 5
          done

          if [ "$ACTIVE" != "1" ]; then
            echo "ATLAS_IP_ACTIVATION=TIMEOUT"
            exit 34
          fi

          rm -f atlas-existing.json atlas-add.json

          echo "ATLAS_IP_ACTIVATION=PASS"
          echo "ATLAS_DYNAMIC_IP_READY=YES"

      # WA_AUTO_ABSENSI_SYNC_ONCE_BEFORE_SEND_V1
      - name: Sync latest Palelu attendance inputs
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          WWEBJS_REMOTE_DATA_PATH: ${{ runner.temp }}/wa-auto-absensi-remoteauth-v3
          TZ: Asia/Jakarta
        run: |
          set -Eeuo pipefail

          : "${MONGODB_URI:?MONGODB_URI missing}"

          mkdir -p "$WWEBJS_REMOTE_DATA_PATH"

          rm -f attendance-sync.log

          npm run attendance:sync-once-production-v3-resilient \
            2>&1 |
            tee attendance-sync.log

          grep -Fxq \
            'REMOTE_AUTH_VERSION=V3' \
            attendance-sync.log

          grep -Fxq \
            'PALELU_CATCHUP_STABLE=YES' \
            attendance-sync.log

          grep -Fxq \
            'ATTENDANCE_SYNC_ONCE_CATCHUP=PASS' \
            attendance-sync.log

          grep -Fxq \
            'ATTENDANCE_SYNC_ONCE=PASS' \
            attendance-sync.log

          grep -Fxq \
            'PRODUCTION_V3_SYNC_RESILIENT=PASS' \
            attendance-sync.log

          grep -Fxq \
            'PRODUCTION_V3_SYNC_SENDER_RETRY=NO' \
            attendance-sync.log

          echo "ATTENDANCE_SYNC_BEFORE_SEND=PASS"

      - name: Run Production attendance sender
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          WWEBJS_REMOTE_DATA_PATH: ${{ runner.temp }}/wa-auto-absensi-remoteauth-v3
          TZ: Asia/Jakarta
        run: |
          set -Eeuo pipefail

          : "${MONGODB_URI:?MONGODB_URI missing}"
          echo "ATTENDANCE_ACTION=$ATTENDANCE_ACTION"

          mkdir -p "$WWEBJS_REMOTE_DATA_PATH"

          echo "REMOTE_DATA_PATH_READY=YES"

          rm -f attendance.log

          case "$ATTENDANCE_ACTION" in
            checkin)
              npm run wa:send-checkin-production \
                2>&1 |
                tee attendance.log
              ;;

            checkout)
              npm run wa:send-checkout-production \
                2>&1 |
                tee attendance.log
              ;;

            *)
              echo "ATTENDANCE_ACTION_RUNTIME_VALID=NO"
              exit 31
              ;;
          esac

      - name: Verify Production attendance result
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f attendance.log

          grep -Fxq \
            'AUTH_MODE=REMOTE' \
            attendance.log

          grep -Fxq \
            'REMOTE_AUTH_VERSION=V3' \
            attendance.log

          grep -Fxq \
            'MONGODB_CONNECTED=YES' \
            attendance.log

          grep -Fxq \
            'REMOTE_SESSION_EXISTS_BEFORE=YES' \
            attendance.log

          grep -Fxq \
            'WHATSAPP_READY=YES' \
            attendance.log

          grep -Fxq \
            'TARGET_GROUP_FOUND=YES' \
            attendance.log

          grep -Fxq \
            'TARGET_GROUP_NAME=Aktif Tim Magang OCN' \
            attendance.log

          grep -Fxq \
            'TARGET_GROUP_SAFE=YES' \
            attendance.log

          if grep -Fxq \
            'QR_RECEIVED=YES' \
            attendance.log
          then
            echo "QR_REQUIRED_IN_CLOUD=YES"
            exit 40
          fi

          echo "QR_REQUIRED_IN_CLOUD=NO"

          # ATTENDANCE_LEAVE_SAFE_SKIP_V1
          # A verified leave date is a successful NO-SEND outcome.
          if grep -Fxq 'ATTENDANCE_LEAVE_SKIP=YES' attendance.log; then
            grep -Fxq 'LEAVE_TODAY=YES' attendance.log
            grep -Fxq 'REASON=LEAVE_DATE' attendance.log
            grep -Fxq 'ACTION=SKIP' attendance.log
            grep -Fxq 'MESSAGE_SENT=NO' attendance.log
            grep -Eq '^LEAVE_CHECK_DATE=[0-9]{4}-[0-9]{2}-[0-9]{2}$' attendance.log

            if grep -Fxq 'MESSAGE_SENT=YES' attendance.log ||
               grep -Fxq 'SEND_START=YES' attendance.log; then
              echo "ATTENDANCE_LEAVE_SEND_VIOLATION=YES"
              exit 42
            fi

            case "$ATTENDANCE_ACTION" in
              checkin)
                grep -Fxq 'STEP_PRODUCTION_CHECKIN=SKIPPED_LEAVE' attendance.log
                ;;
              checkout)
                grep -Fxq 'STEP_PRODUCTION_CHECKOUT=SKIPPED_LEAVE' attendance.log
                ;;
              *)
                exit 43
                ;;
            esac

            echo "ATTENDANCE_RESULT=LEAVE_SKIP"
            echo "PRODUCTION_CLOUD_ATTENDANCE=PASS"
            exit 0
          fi

          if grep -Fxq \
            'MESSAGE_SENT=YES' \
            attendance.log
          then
            echo "ATTENDANCE_RESULT=SENT"
            echo "PRODUCTION_CLOUD_ATTENDANCE=PASS"
            exit 0
          fi

          if \
            grep -Fxq \
              'DUPLICATE_FOUND=YES' \
              attendance.log &&
            grep -Fxq \
              'ACTION=SKIP' \
              attendance.log &&
            grep -Fxq \
              'MESSAGE_SENT=NO' \
              attendance.log
          then
            echo "ATTENDANCE_RESULT=DUPLICATE_SKIP"
            echo "PRODUCTION_CLOUD_ATTENDANCE=PASS"
            exit 0
          fi

          echo "ATTENDANCE_RESULT=UNEXPECTED"
          echo "PRODUCTION_CLOUD_ATTENDANCE=FAIL"
          exit 41

      # WA_AUTO_ABSENSI_ATLAS_DYNAMIC_IP_CLEANUP_V1
      - name: Remove temporary Atlas runner IP
        if: always()
        shell: bash
        env:
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
          ATLAS_RUNNER_IP: ${{ env.ATLAS_RUNNER_IP }}
          ATLAS_IP_CREATED: ${{ env.ATLAS_IP_CREATED }}
        run: |
          set -Eeuo pipefail

          if [ -z "${ATLAS_RUNNER_IP:-}" ]; then
            echo "ATLAS_IP_CLEANUP=SKIPPED_NO_RUNNER_IP"
            exit 0
          fi

          if [ "${ATLAS_IP_CREATED:-0}" != "1" ]; then
            echo "ATLAS_IP_CLEANUP=SKIPPED_PREEXISTING"
            exit 0
          fi

          API_ACCEPT="application/vnd.atlas.2025-03-12+json"

          TOKEN_JSON="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://cloud.mongodb.com/api/oauth/token" \
              --user "${ATLAS_CLIENT_ID}:${ATLAS_CLIENT_SECRET}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data "grant_type=client_credentials"
          )"

          ACCESS_TOKEN="$(
            printf '%s' "$TOKEN_JSON" |
              jq -r '.access_token // empty'
          )"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ATLAS_CLEANUP_OAUTH=FAIL"
            exit 40
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$ATLAS_RUNNER_IP"

          BASE_URL="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"

          DELETE_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request DELETE \
              --url "${BASE_URL}/${ATLAS_RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$DELETE_CODE" != "204" ] &&
             [ "$DELETE_CODE" != "404" ]; then

            echo "ATLAS_IP_CLEANUP=FAIL"
            echo "ATLAS_IP_CLEANUP_HTTP=${DELETE_CODE}"
            exit 41
          fi

          VERIFY_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request GET \
              --url "${BASE_URL}/${ATLAS_RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$VERIFY_CODE" != "404" ]; then
            echo "ATLAS_IP_CLEANUP_VERIFY=FAIL"
            exit 42
          fi

          echo "ATLAS_IP_CLEANUP=PASS"
          echo "ATLAS_IP_CLEANUP_VERIFY=PASS"

      - name: Cleanup attendance local state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf \
            "${RUNNER_TEMP}/wa-auto-absensi-remoteauth-v3"

          rm -f \
            attendance.log

          echo "EPHEMERAL_ATTENDANCE_STATE_REMOVED=YES"
