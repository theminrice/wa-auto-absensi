name: WA Attendance Testing Cloud

on:
  workflow_dispatch:
    inputs:
      action:
        description: Attendance action
        required: true
        type: choice
        options:
          - checkin
          - checkout
      confirm:
        description: Type Testing to authorize the test-group run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wa-attendance-testing-cloud
  cancel-in-progress: false

jobs:
  attendance-testing:
    name: Attendance Testing Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Locate Chrome
        shell: bash
        run: |
          set -Eeuo pipefail

          CHROME=""

          for candidate in \
            google-chrome-stable \
            google-chrome \
            chromium \
            chromium-browser
          do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            echo "CHROME_FOUND=NO"
            exit 20
          fi

          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "CHROME_FOUND=YES"

      - name: Attendance Testing safety guard
        shell: bash
        env:
          ATTENDANCE_ACTION: ${{ inputs.action }}
          ATTENDANCE_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail

          if [ "$ATTENDANCE_CONFIRM" != "Testing" ]; then
            echo "TESTING_CONFIRMATION=FAIL"
            exit 21
          fi

          echo "TESTING_CONFIRMATION=PASS"

          case "$ATTENDANCE_ACTION" in
            checkin|checkout)
              ;;
            *)
              echo "ATTENDANCE_ACTION_VALID=NO"
              exit 22
              ;;
          esac

          echo "ATTENDANCE_ACTION_VALID=YES"

          for source in \
            src/wa-send-checkin-testing.js \
            src/wa-send-checkout-testing.js
          do
            grep -Fq \
              'WA_AUTO_ABSENSI_DUAL_AUTH_V1' \
              "$source"

            grep -Fq \
              "EXPECTED_GROUP_NAME = 'Testing'" \
              "$source"

            grep -Fq \
              "createRemoteAuth" \
              "$source"

            grep -Fq \
              "REMOTE_SESSION_MISSING" \
              "$source"

            grep -Fq \
              "REMOTE_AUTH_QR_FORBIDDEN=YES" \
              "$source"
          done

          if grep -Eq \
            '[0-9]{10,}@g\.us' \
            src/wa-send-checkin-testing.js \
            src/wa-send-checkout-testing.js
          then
            echo "HARDCODED_GROUP_ID=YES"
            exit 23
          fi

          if grep -Fq \
            'Aktif Tim Magang OCN' \
            src/wa-send-checkin-testing.js \
            src/wa-send-checkout-testing.js
          then
            echo "PRODUCTION_GROUP_REFERENCE=YES"
            exit 24
          fi

          echo "HARDCODED_GROUP_ID=NO"
          echo "PRODUCTION_GROUP_REFERENCE=NO"
          echo "TESTING_SOURCE_GUARD=PASS"

      # WA_AUTO_ABSENSI_ATLAS_DYNAMIC_IP_ADD_V1
      - name: Add temporary Atlas runner IP
        shell: bash
        env:
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: |
          set -Eeuo pipefail

          : "${ATLAS_CLIENT_ID:?ATLAS_CLIENT_ID missing}"
          : "${ATLAS_CLIENT_SECRET:?ATLAS_CLIENT_SECRET missing}"
          : "${ATLAS_PROJECT_ID:?ATLAS_PROJECT_ID missing}"

          API_ACCEPT="application/vnd.atlas.2025-03-12+json"

          TOKEN_JSON="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://cloud.mongodb.com/api/oauth/token" \
              --user "${ATLAS_CLIENT_ID}:${ATLAS_CLIENT_SECRET}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data "grant_type=client_credentials"
          )"

          ACCESS_TOKEN="$(
            printf '%s' "$TOKEN_JSON" |
              jq -r '.access_token // empty'
          )"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ATLAS_OAUTH=FAIL"
            exit 30
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ATLAS_OAUTH=PASS"

          RUNNER_IP="$(
            curl \
              -4 \
              --fail \
              --silent \
              --show-error \
              "https://api.ipify.org"
          )"

          python3 - "$RUNNER_IP" <<'PY'
          import ipaddress
          import sys

          ip = ipaddress.ip_address(sys.argv[1].strip())

          if ip.version != 4:
              raise SystemExit("Runner public address is not IPv4")
          PY

          echo "::add-mask::$RUNNER_IP"

          echo "ATLAS_RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "ATLAS_IP_CREATED=0" >> "$GITHUB_ENV"

          BASE_URL="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"

          CHECK_CODE="$(
            curl \
              --silent \
              --show-error \
              --output atlas-existing.json \
              --write-out "%{http_code}" \
              --request GET \
              --url "${BASE_URL}/${RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$CHECK_CODE" = "200" ]; then

            echo "ATLAS_IP_PREEXISTING=YES"

          elif [ "$CHECK_CODE" = "404" ]; then

            echo "ATLAS_IP_PREEXISTING=NO"

            DELETE_AFTER="$(
              date -u \
                -d '+30 minutes' \
                '+%Y-%m-%dT%H:%M:%SZ'
            )"

            COMMENT="WA Auto Absensi RemoteAuth ${GITHUB_RUN_ID}"

            PAYLOAD="$(
              jq -nc \
                --arg ip "$RUNNER_IP" \
                --arg comment "$COMMENT" \
                --arg deleteAfterDate "$DELETE_AFTER" \
                '[{
                  ipAddress: $ip,
                  comment: $comment,
                  deleteAfterDate: $deleteAfterDate
                }]'
            )"

            ADD_CODE="$(
              curl \
                --silent \
                --show-error \
                --output atlas-add.json \
                --write-out "%{http_code}" \
                --request POST \
                --url "$BASE_URL" \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                --header "Accept: ${API_ACCEPT}" \
                --header "Content-Type: application/json" \
                --data "$PAYLOAD"
            )"

            if [ "$ADD_CODE" != "200" ] &&
               [ "$ADD_CODE" != "201" ]; then

              echo "ATLAS_IP_ADD=FAIL"
              exit 31
            fi

            echo "ATLAS_IP_CREATED=1" >> "$GITHUB_ENV"

            echo "ATLAS_IP_ADD=PASS"
            echo "ATLAS_IP_TEMPORARY_EXPIRY=ENABLED"

          else

            echo "ATLAS_IP_PRECHECK_HTTP=${CHECK_CODE}"
            echo "ATLAS_IP_PRECHECK=FAIL"
            exit 32
          fi

          ACTIVE=0

          for ATTEMPT in $(seq 1 24); do

            STATUS_JSON="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request GET \
                --url "${BASE_URL}/${RUNNER_IP}/status" \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                --header "Accept: ${API_ACCEPT}"
            )"

            STATUS="$(
              printf '%s' "$STATUS_JSON" |
                jq -r '.STATUS // .status // empty'
            )"

            echo "ATLAS_IP_STATUS=${STATUS:-UNKNOWN}"

            if [ "$STATUS" = "ACTIVE" ]; then
              ACTIVE=1
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "ATLAS_IP_ACTIVATION=FAIL"
              exit 33
            fi

            sleep 5
          done

          if [ "$ACTIVE" != "1" ]; then
            echo "ATLAS_IP_ACTIVATION=TIMEOUT"
            exit 34
          fi

          rm -f atlas-existing.json atlas-add.json

          echo "ATLAS_IP_ACTIVATION=PASS"
          echo "ATLAS_DYNAMIC_IP_READY=YES"

- name: Run Testing attendance sender
        shell: bash
        env:
          ATTENDANCE_ACTION: ${{ inputs.action }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          WA_TARGET_GROUP_ID: ${{ secrets.WA_TARGET_GROUP_ID }}
          WA_REMOTE_AUTH_DATA_PATH: ${{ runner.temp }}/wa-auto-absensi-remoteauth
          TZ: Asia/Jakarta
        run: |
          set -Eeuo pipefail

          : "${MONGODB_URI:?MONGODB_URI missing}"
          : "${WA_TARGET_GROUP_ID:?WA_TARGET_GROUP_ID missing}"

          echo "::add-mask::$WA_TARGET_GROUP_ID"

          if [[ "$WA_TARGET_GROUP_ID" != *@g.us ]]; then
            echo "TARGET_GROUP_ID_VALID=NO"
            exit 30
          fi

          echo "TARGET_GROUP_ID_VALID=YES"
          echo "ATTENDANCE_ACTION=$ATTENDANCE_ACTION"

          rm -f attendance.log

          case "$ATTENDANCE_ACTION" in
            checkin)
              npm run wa:send-checkin-testing \
                2>&1 |
                tee attendance.log
              ;;

            checkout)
              npm run wa:send-checkout-testing \
                2>&1 |
                tee attendance.log
              ;;

            *)
              echo "ATTENDANCE_ACTION_RUNTIME_VALID=NO"
              exit 31
              ;;
          esac

      - name: Verify Testing attendance result
        shell: bash
        env:
          ATTENDANCE_ACTION: ${{ inputs.action }}
        run: |
          set -Eeuo pipefail

          test -f attendance.log

          grep -Fxq \
            'AUTH_MODE=REMOTE' \
            attendance.log

          grep -Fxq \
            'MONGODB_CONNECTED=YES' \
            attendance.log

          grep -Fxq \
            'REMOTE_SESSION_EXISTS_BEFORE=YES' \
            attendance.log

          grep -Fxq \
            'WHATSAPP_READY=YES' \
            attendance.log

          grep -Fxq \
            'TARGET_GROUP_FOUND=YES' \
            attendance.log

          grep -Fxq \
            'TARGET_GROUP_NAME=Testing' \
            attendance.log

          grep -Fxq \
            'TARGET_GROUP_SAFE=YES' \
            attendance.log

          if grep -Fxq \
            'QR_RECEIVED=YES' \
            attendance.log
          then
            echo "QR_REQUIRED_IN_CLOUD=YES"
            exit 40
          fi

          echo "QR_REQUIRED_IN_CLOUD=NO"

          if grep -Fxq \
            'MESSAGE_SENT=YES' \
            attendance.log
          then
            echo "ATTENDANCE_RESULT=SENT"
            echo "TESTING_CLOUD_ATTENDANCE=PASS"
            exit 0
          fi

          if \
            grep -Fxq \
              'DUPLICATE_FOUND=YES' \
              attendance.log &&
            grep -Fxq \
              'ACTION=SKIP' \
              attendance.log &&
            grep -Fxq \
              'MESSAGE_SENT=NO' \
              attendance.log
          then
            echo "ATTENDANCE_RESULT=DUPLICATE_SKIP"
            echo "TESTING_CLOUD_ATTENDANCE=PASS"
            exit 0
          fi

          echo "ATTENDANCE_RESULT=UNEXPECTED"
          echo "TESTING_CLOUD_ATTENDANCE=FAIL"
          exit 41

      # WA_AUTO_ABSENSI_ATLAS_DYNAMIC_IP_CLEANUP_V1
      - name: Remove temporary Atlas runner IP
        if: always()
        shell: bash
        env:
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
          ATLAS_RUNNER_IP: ${{ env.ATLAS_RUNNER_IP }}
          ATLAS_IP_CREATED: ${{ env.ATLAS_IP_CREATED }}
        run: |
          set -Eeuo pipefail

          if [ -z "${ATLAS_RUNNER_IP:-}" ]; then
            echo "ATLAS_IP_CLEANUP=SKIPPED_NO_RUNNER_IP"
            exit 0
          fi

          if [ "${ATLAS_IP_CREATED:-0}" != "1" ]; then
            echo "ATLAS_IP_CLEANUP=SKIPPED_PREEXISTING"
            exit 0
          fi

          API_ACCEPT="application/vnd.atlas.2025-03-12+json"

          TOKEN_JSON="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://cloud.mongodb.com/api/oauth/token" \
              --user "${ATLAS_CLIENT_ID}:${ATLAS_CLIENT_SECRET}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data "grant_type=client_credentials"
          )"

          ACCESS_TOKEN="$(
            printf '%s' "$TOKEN_JSON" |
              jq -r '.access_token // empty'
          )"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ATLAS_CLEANUP_OAUTH=FAIL"
            exit 40
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$ATLAS_RUNNER_IP"

          BASE_URL="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"

          DELETE_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request DELETE \
              --url "${BASE_URL}/${ATLAS_RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$DELETE_CODE" != "204" ] &&
             [ "$DELETE_CODE" != "404" ]; then

            echo "ATLAS_IP_CLEANUP=FAIL"
            echo "ATLAS_IP_CLEANUP_HTTP=${DELETE_CODE}"
            exit 41
          fi

          VERIFY_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request GET \
              --url "${BASE_URL}/${ATLAS_RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$VERIFY_CODE" != "404" ]; then
            echo "ATLAS_IP_CLEANUP_VERIFY=FAIL"
            exit 42
          fi

          echo "ATLAS_IP_CLEANUP=PASS"
          echo "ATLAS_IP_CLEANUP_VERIFY=PASS"

- name: Cleanup attendance local state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf \
            "${RUNNER_TEMP}/wa-auto-absensi-remoteauth"

          rm -f \
            attendance.log

          echo "EPHEMERAL_ATTENDANCE_STATE_REMOVED=YES"
