name: WA RemoteAuth V3 Health

# BRANCH ONLY: LAST_GOOD preflight, or explicitly fingerprint-approved cleanup.
# main continues to run its original RemoteAuth V3 Health workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight first; cleanup requires both fingerprints
        required: true
        type: choice
        options:
          - preflight
          - cleanup
        default: preflight
      expected_orphan_fingerprint:
        description: Cleanup only - exact 64-character orphan fingerprint
        required: false
        type: string
      expected_valid_fingerprint:
        description: Cleanup only - exact 64-character valid LAST_GOOD fingerprint
        required: false
        type: string
      confirm:
        description: Cleanup only - type Delete-52-LAST_GOOD-Orphans
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wa-attendance-production-cloud
  cancel-in-progress: false

jobs:
  health-v3:
    name: RemoteAuth V3 Health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
      ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
      ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail

          CHROME_PATH="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"

          if [ -z "$CHROME_PATH" ]; then
            echo "CHROME_NOT_FOUND=YES"
            exit 1
          fi

          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROME_FOUND=YES"

      - name: Add temporary Atlas runner IP
        shell: bash
        env:
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: |
          set -Eeuo pipefail

          : "${ATLAS_CLIENT_ID:?ATLAS_CLIENT_ID missing}"
          : "${ATLAS_CLIENT_SECRET:?ATLAS_CLIENT_SECRET missing}"
          : "${ATLAS_PROJECT_ID:?ATLAS_PROJECT_ID missing}"

          API_ACCEPT="application/vnd.atlas.2025-03-12+json"

          TOKEN_JSON="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://cloud.mongodb.com/api/oauth/token" \
              --user "${ATLAS_CLIENT_ID}:${ATLAS_CLIENT_SECRET}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data "grant_type=client_credentials"
          )"

          ACCESS_TOKEN="$(
            printf '%s' "$TOKEN_JSON" |
              jq -r '.access_token // empty'
          )"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ATLAS_OAUTH=FAIL"
            exit 30
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ATLAS_OAUTH=PASS"

          RUNNER_IP="$(
            curl \
              -4 \
              --fail \
              --silent \
              --show-error \
              "https://api.ipify.org"
          )"

          python3 - "$RUNNER_IP" <<'PY'
          import ipaddress
          import sys

          ip = ipaddress.ip_address(sys.argv[1].strip())

          if ip.version != 4:
              raise SystemExit("Runner public address is not IPv4")
          PY

          echo "::add-mask::$RUNNER_IP"

          echo "ATLAS_RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "ATLAS_IP_CREATED=0" >> "$GITHUB_ENV"

          BASE_URL="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"

          CHECK_CODE="$(
            curl \
              --silent \
              --show-error \
              --output atlas-existing.json \
              --write-out "%{http_code}" \
              --request GET \
              --url "${BASE_URL}/${RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$CHECK_CODE" = "200" ]; then

            echo "ATLAS_IP_PREEXISTING=YES"

          elif [ "$CHECK_CODE" = "404" ]; then

            echo "ATLAS_IP_PREEXISTING=NO"

            DELETE_AFTER="$(
              date -u \
                -d '+30 minutes' \
                '+%Y-%m-%dT%H:%M:%SZ'
            )"

            COMMENT="WA Auto Absensi RemoteAuth ${GITHUB_RUN_ID}"

            PAYLOAD="$(
              jq -nc \
                --arg ip "$RUNNER_IP" \
                --arg comment "$COMMENT" \
                --arg deleteAfterDate "$DELETE_AFTER" \
                '[{
                  ipAddress: $ip,
                  comment: $comment,
                  deleteAfterDate: $deleteAfterDate
                }]'
            )"

            ADD_CODE="$(
              curl \
                --silent \
                --show-error \
                --output atlas-add.json \
                --write-out "%{http_code}" \
                --request POST \
                --url "$BASE_URL" \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                --header "Accept: ${API_ACCEPT}" \
                --header "Content-Type: application/json" \
                --data "$PAYLOAD"
            )"

            if [ "$ADD_CODE" != "200" ] &&
               [ "$ADD_CODE" != "201" ]; then

              echo "ATLAS_IP_ADD=FAIL"
              exit 31
            fi

            echo "ATLAS_IP_CREATED=1" >> "$GITHUB_ENV"

            echo "ATLAS_IP_ADD=PASS"
            echo "ATLAS_IP_TEMPORARY_EXPIRY=ENABLED"

          else

            echo "ATLAS_IP_PRECHECK_HTTP=${CHECK_CODE}"
            echo "ATLAS_IP_PRECHECK=FAIL"
            exit 32
          fi

          ACTIVE=0

          for ATTEMPT in $(seq 1 24); do

            STATUS_JSON="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request GET \
                --url "${BASE_URL}/${RUNNER_IP}/status" \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" \
                --header "Accept: ${API_ACCEPT}"
            )"

            STATUS="$(
              printf '%s' "$STATUS_JSON" |
                jq -r '.STATUS // .status // empty'
            )"

            echo "ATLAS_IP_STATUS=${STATUS:-UNKNOWN}"

            if [ "$STATUS" = "ACTIVE" ]; then
              ACTIVE=1
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "ATLAS_IP_ACTIVATION=FAIL"
              exit 33
            fi

            sleep 5
          done

          if [ "$ACTIVE" != "1" ]; then
            echo "ATLAS_IP_ACTIVATION=TIMEOUT"
            exit 34
          fi

          rm -f atlas-existing.json atlas-add.json

          echo "ATLAS_IP_ACTIVATION=PASS"
          echo "ATLAS_DYNAMIC_IP_READY=YES"
      - name: Guarded LAST_GOOD orphan preflight or cleanup
        shell: bash
        env:
          LAST_GOOD_CLEANUP_MODE: ${{ inputs.mode }}
          LAST_GOOD_EXPECTED_ORPHAN_FINGERPRINT: ${{ inputs.expected_orphan_fingerprint }}
          LAST_GOOD_EXPECTED_VALID_FINGERPRINT: ${{ inputs.expected_valid_fingerprint }}
          LAST_GOOD_CLEANUP_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "cleanup/remoteauth-v3-last-good-guarded-v1-20260923"
          node --check src/wa-remoteauth-v3-last-good-cleanup-guarded.js
          case "$LAST_GOOD_CLEANUP_MODE" in
            preflight) ;;
            cleanup)
              test "$LAST_GOOD_CLEANUP_CONFIRM" = "Delete-52-LAST_GOOD-Orphans"
              [[ "$LAST_GOOD_EXPECTED_ORPHAN_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
              [[ "$LAST_GOOD_EXPECTED_VALID_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
              ;;
            *) exit 42 ;;
          esac
          echo "LAST_GOOD_CLEANUP_BRANCH_GUARD=PASS"
          echo "NO_WHATSAPP_MESSAGE_WILL_BE_SENT=YES"
          node src/wa-remoteauth-v3-last-good-cleanup-guarded.js \
            2>&1 | tee last-good-cleanup.log
          grep -Fxq 'CANDIDATE_PRESERVED_GUARD=PASS' last-good-cleanup.log
          grep -Fxq 'LAST_GOOD_VALID_FILE_CONTENT_GUARD=PASS' last-good-cleanup.log
          grep -Fxq 'ACTIVE_BUCKET_READ_OR_WRITE=NO' last-good-cleanup.log
          grep -Fxq 'MESSAGE_SENT=NO' last-good-cleanup.log
          if [ "$LAST_GOOD_CLEANUP_MODE" = preflight ]; then
            grep -Fxq 'LAST_GOOD_PREFLIGHT=PASS' last-good-cleanup.log
            grep -Fxq 'LAST_GOOD_BACKUP_WRITES=0' last-good-cleanup.log
            grep -Fxq 'LAST_GOOD_CHUNKS_DELETED=0' last-good-cleanup.log
          else
            grep -Fxq 'LAST_GOOD_BACKUP_READBACK=PASS' last-good-cleanup.log
            grep -Fxq 'LAST_GOOD_CHUNKS_DELETED=52' last-good-cleanup.log
            grep -Fxq 'LAST_GOOD_POSTCHECK_VALID_CHUNKS=92' last-good-cleanup.log
            grep -Fxq 'LAST_GOOD_POSTCHECK_ORPHAN_CHUNKS=0' last-good-cleanup.log
            grep -Fxq 'LAST_GOOD_GUARDED_CLEANUP=PASS' last-good-cleanup.log
          fi
          echo "LAST_GOOD_CLEANUP_WORKFLOW=PASS"

      - name: Remove ephemeral LAST_GOOD cleanup log
        if: always()
        shell: bash
        run: |
          rm -f last-good-cleanup.log
          echo "LAST_GOOD_CLEANUP_LOG_REMOVED=YES"

      - name: Remove temporary Atlas runner IP
        if: always()
        shell: bash
        env:
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
          ATLAS_RUNNER_IP: ${{ env.ATLAS_RUNNER_IP }}
          ATLAS_IP_CREATED: ${{ env.ATLAS_IP_CREATED }}
        run: |
          set -Eeuo pipefail

          if [ -z "${ATLAS_RUNNER_IP:-}" ]; then
            echo "ATLAS_IP_CLEANUP=SKIPPED_NO_RUNNER_IP"
            exit 0
          fi

          if [ "${ATLAS_IP_CREATED:-0}" != "1" ]; then
            echo "ATLAS_IP_CLEANUP=SKIPPED_PREEXISTING"
            exit 0
          fi

          API_ACCEPT="application/vnd.atlas.2025-03-12+json"

          TOKEN_JSON="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://cloud.mongodb.com/api/oauth/token" \
              --user "${ATLAS_CLIENT_ID}:${ATLAS_CLIENT_SECRET}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data "grant_type=client_credentials"
          )"

          ACCESS_TOKEN="$(
            printf '%s' "$TOKEN_JSON" |
              jq -r '.access_token // empty'
          )"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ATLAS_CLEANUP_OAUTH=FAIL"
            exit 40
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$ATLAS_RUNNER_IP"

          BASE_URL="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"

          DELETE_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request DELETE \
              --url "${BASE_URL}/${ATLAS_RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$DELETE_CODE" != "204" ] &&
             [ "$DELETE_CODE" != "404" ]; then

            echo "ATLAS_IP_CLEANUP=FAIL"
            echo "ATLAS_IP_CLEANUP_HTTP=${DELETE_CODE}"
            exit 41
          fi

          VERIFY_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request GET \
              --url "${BASE_URL}/${ATLAS_RUNNER_IP}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: ${API_ACCEPT}"
          )"

          if [ "$VERIFY_CODE" != "404" ]; then
            echo "ATLAS_IP_CLEANUP_VERIFY=FAIL"
            exit 42
          fi

          echo "ATLAS_IP_CLEANUP=PASS"
          echo "ATLAS_IP_CLEANUP_VERIFY=PASS"
